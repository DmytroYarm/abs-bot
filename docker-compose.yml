version: '3.8'

services:
  bot:
    build: .
    container_name: telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # если нужно сохранять данные
```

## 4. Файл .env для переменных окружения
```
BOT_TOKEN=your_bot_token_here
# другие переменные
```

## 5. Файл .dockerignore
```
__pycache__
*.pyc
*.pyo
*.pyd
.git
.env
venv/
.vscode/
